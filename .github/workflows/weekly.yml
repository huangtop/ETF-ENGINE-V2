name: ETF Weekly Validation
on:
  workflow_dispatch:
  schedule:
    - cron: "40 23 * * 0"
permissions:
  contents: read
concurrency:
  group: etf-weekly-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .[dev]
      - name: Run full test suite
        run: pytest -q
      - name: Validate ETF universe and seed data
        run: python -m etf_engine.cli validate
