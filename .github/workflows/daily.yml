name: ETF Daily Pipeline
on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: "20 22 * * 1-5"
permissions:
  contents: write
concurrency:
  group: etf-daily
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Restore normalized ETF cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/normalized/prices
            data/normalized/holdings
          key: etf-normalized-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            etf-normalized-${{ runner.os }}-
      - run: python -m etf_engine.cli validate
      - name: Run bounded ETF pipeline
        env:
          ETF_BOOTSTRAP_LIMIT: "10"
          ETF_HOLDINGS_ROTATION_LIMIT: "40"
        run: python -m etf_engine.cli run --market all
      - name: Save normalized ETF cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            data/normalized/prices
            data/normalized/holdings
          key: etf-normalized-${{ runner.os }}-${{ github.run_id }}
      - name: Commit generated public data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public data/history/holdings data/normalized/metrics data/state
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: refresh ETF dataset"
            git push
          fi
